spring.application.name=backend-msal

server.port=8080

# ===================================================================
# Cloud Database (AWS RDS / PostgreSQL / MySQL) con Fallback a H2
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:/opt/backend-msal/data/pedidosdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# OAuth2 Resource Server & JWT
# ===================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/f402d005-2163-4d89-a6cd-e07c25b973b2/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=54bc913a-2f45-4e55-9eae-b30616a9f8d5

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO