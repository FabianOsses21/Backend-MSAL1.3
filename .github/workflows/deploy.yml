name: Backend CI/CD Pipeline - AWS Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Test & Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build & Run Tests with Maven
        working-directory: backend-msal
        run: ./mvnw clean package

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Upload JAR Artifact to Amazon S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="pedidos360-artifacts-${ACCOUNT_ID}"
          aws s3 cp backend-msal/target/backend-msal-0.0.1-SNAPSHOT.jar "s3://${BUCKET_NAME}/backend.jar"

      - name: Deploy to EC2 using AWS Systems Manager (SSM)
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=Pedidos360-Backend" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Error: No se encontró una instancia EC2 'Pedidos360-Backend' en ejecución."
            exit 1
          fi

          echo "Desplegando en instancia: $INSTANCE_ID"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="pedidos360-artifacts-${ACCOUNT_ID}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"mkdir -p /opt/backend-msal\",
              \"aws s3 cp s3://${BUCKET_NAME}/backend.jar /opt/backend-msal/backend.jar\",
              \"systemctl restart backend\",
              \"sleep 3\",
              \"systemctl is-active backend\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM enviado: $COMMAND_ID. Esperando ejecución..."
          sleep 12
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "[Status,StandardOutputContent]" \
            --output table
